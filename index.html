<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">

<style>
body{
  margin:0;
  font-family: Arial;
  color:white;
  background:#0d1117;

canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:-1;

.menu{
  display:flex;
  justify-content:center;

  padding:15px;

  color:white;

.botao-github{
  display:inline-block;
  margin-top:10px;
  color:white;
  background:#238636;
  padding:8px 12px;
  text-decoration:none;
  border-radius:5px;

</style>
</head>

<body>

<canvas id="bg"></canvas>

<nav class="menu">
  <a href="#perfil">Sobre</a>
  <a href="#skills">Skills</a>
  <a href="#projetos">Projetos</a>

<div class="container">

<section id="perfil">
  <img src="foto.jpg" class="foto">
  <h1>Felipe <span>Andrade</span></h1>
</section>

<section id="skills">
  <h2>Minhas Skills</h2>
  <p>HTML, CSS, JavaScript, Python</p>
</section>

<section id="projetos">
  <h2>Projetos</h2>

  <div class="grid-projetos">

    <!-- PYTHON -->
    <div class="card-projeto">
      <h3>📱 Gestor de Tarefas</h3>
      <p>Aplicativo com Python + Kivy</p>
      <a class="botao-github" href="https://github.com/FELIPEA03" target="_blank">
        Ver GitHub
      </a>
    </div>

    <!-- JS -->
    <div class="card-projeto">
      <h3>💡 Abajur Interativo</h3>

      <div class="carousel">
        <button class="seta" onclick="trocarImagemJS(-1)">❮</button>
        <img id="img-js" src="img1.png">
        <button class="seta" onclick="trocarImagemJS(1)">❯</button>
      </div>

      <a class="botao-github" href="https://github.com/FELIPEA03" target="_blank">
        Ver GitHub
      </a>
    </div>

    <!-- HTML CSS -->
    <div class="card-projeto">
      <h3>⌚ Loja de Relógios</h3>

      <div class="carousel">
        <button class="seta" onclick="trocarImagemHTML(-1)">❮</button>
        <img id="img-html" src="img11.png">
        <button class="seta" onclick="trocarImagemHTML(1)">❯</button>
      </div>

      <a class="botao-github" href="https://github.com/FELIPEA03" target="_blank">
        Ver GitHub
      </a>
    </div>

  </div>
</section>

<section id="contato">
  <h2>Contato</h2>
  <p>📱 WhatsApp: 11 91866-2998</p>
  <p>
    💻 GitHub:
    <a href="https://github.com/FELIPEA03" target="_blank">
      github.com/FELIPEA03
    </a>
  </p>
</section>

</div>

<script>

/* CAROUSEL */
function criarCarousel(imagens, id){
  let i = 0;

  return function(d){
    i += d;

    if(i < 0) i = imagens.length - 1;
    if(i >= imagens.length) i = 0;

    document.getElementById(id).src = imagens[i];
  }
}

const trocarImagemJS = criarCarousel(
  ["img1.png","img2.png","img3.png"],
  "img-js"
);

const trocarImagemHTML = criarCarousel(
  ["img11.png","img22.png","img33.png"],
  "img-html"
);

/* CANVAS FUNDO */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resizeCanvas();

let particles = [];

for(let i=0;i<80;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    size:Math.random()*2+1,
    speedX:Math.random()*1-0.5,
    speedY:Math.random()*1-0.5
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle="#58a6ff";
    ctx.fill();

    p.x+=p.speedX;
    p.y+=p.speedY;

    if(p.x<0||p.x>canvas.width) p.speedX*=-1;
    if(p.y<0||p.y>canvas.height) p.speedY*=-1;
  });

  requestAnimationFrame(draw);
}

draw();

window.addEventListener("resize", resizeCanvas);

</script>

</body>
</html>
