<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Rede Social</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav class="sidebar">
            <h2>RedeSocial</h2>
            <ul>
                <li><a href="#">🏠 Home</a></li>
                <li><a href="#">🔍 Explorar</a></li>
                <li><a href="#">🔔 Notificações</a></li>
                <li><a href="#">👤 Perfil</a></li>
            </ul>
            <button class="btn-post">Postar</button>
        </nav>

        <main class="feed">
            <header>Página Inicial</header>
            
            <div class="create-post">
                <textarea placeholder="O que está acontecendo?"></textarea>
                <button>Publicar</button>
            </div>

            <article class="post">
                <div class="avatar"></div>
                <div class="post-content">
                    <p><strong>Dev Junior</strong> @dev_jr • 2h</p>
                    <p>Estou começando a criar minha própria rede social com HTML e CSS! 🚀</p>
                    <div class="post-actions">
                        <span>💬 5</span>
                        <span>❤️ 12</span>
                        <span>🔄 3</span>
                    </div>
                </div>
            </article>
        </main>

        <aside class="widgets">
            <div class="widget-box">
                <h3>O que está em alta</h3>
                <p>#WebDesign</p>
                <p>#Programação</p>
                <p>#HTML5</p>
            </div>
        </aside>
    </div>
</body>
</html>
